services:
  - type: web
    name: read-tree
    runtime: node
    plan: free
    branch: master
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/auto
      - key: OPENROUTER_CHAPTER_MODEL
        value: openai/gpt-5.4
      - key: ACTIVATION_REQUIRED
        value: "true"
      - key: ACTIVATION_PROJECT
        value: read-tree
      - key: DEFAULT_NEW_CLIENT_QUOTA
        value: "5"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
