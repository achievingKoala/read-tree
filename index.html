<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="多图书 AI 阅读助手互动演示">
  <title>读页 · AI 阅读助手</title>
  <style>
    :root{--bg:#f5f6fa;--card:#fff;--ink:#171927;--muted:#74798d;--line:#e7e8f0;--primary:#6259e8;--primary-dark:#4941cc;--soft:#efedff;--shadow:0 20px 60px rgba(43,39,94,.09);--radius:22px}
    *{box-sizing:border-box} body{margin:0;min-width:320px;color:var(--ink);background:radial-gradient(circle at 4% 8%,rgba(98,89,232,.1),transparent 28%),radial-gradient(circle at 96% 92%,rgba(255,180,84,.13),transparent 28%),var(--bg);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased} button,input,textarea{font:inherit} button{color:inherit} .hidden{display:none!important}
    .app{width:min(1240px,calc(100% - 40px));min-height:100vh;margin:auto;padding:25px 0 42px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#756cf3,#4f46d2);box-shadow:0 8px 20px rgba(96,87,231,.25)}.brand-mark svg{width:21px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.status-dot{width:8px;height:8px;border-radius:50%;background:#31bf7c;box-shadow:0 0 0 5px rgba(49,191,124,.1)}
    .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}.panel{border:1px solid rgba(231,232,240,.9);border-radius:var(--radius);background:rgba(255,255,255,.88);box-shadow:var(--shadow);backdrop-filter:blur(16px)}
    .library{position:sticky;top:22px;padding:18px}.library-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.library-head h2{margin:0;font-size:16px}.add-btn{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:10px;color:var(--primary);background:var(--soft);font-size:20px;cursor:pointer;transition:.2s}.add-btn:hover{color:#fff;background:var(--primary);transform:rotate(90deg)}
    .current-cover{position:relative;overflow:hidden;min-height:188px;padding:22px;border-radius:16px;color:#fff;background:var(--theme,linear-gradient(150deg,#27253a,#655be3));box-shadow:0 15px 32px rgba(47,43,101,.2)}.current-cover:before{content:"";position:absolute;width:150px;height:150px;right:-48px;top:-50px;border:1px solid rgba(255,255,255,.2);border-radius:50%;box-shadow:0 0 0 22px rgba(255,255,255,.035),0 0 0 44px rgba(255,255,255,.025)}.cover-symbol{position:absolute;right:20px;bottom:16px;color:#ffc46e;font-size:39px}.cover-kicker{position:relative;color:rgba(255,255,255,.62);font-size:9px;letter-spacing:.16em}.current-cover h1{position:relative;margin:40px 0 6px;font-family:Georgia,"Songti SC",serif;font-size:27px;font-weight:600;letter-spacing:.03em}.cover-author{position:relative;color:rgba(255,255,255,.72);font-size:11px}.book-summary{padding:15px 3px 16px;border-bottom:1px solid var(--line)}.book-summary p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}.progress-row{display:flex;justify-content:space-between;margin-top:13px;color:var(--muted);font-size:11px}.progress-track{height:5px;margin-top:7px;border-radius:9px;background:#ececf3;overflow:hidden}.progress-bar{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),#9189f8)}
    .shelf-label{margin:16px 2px 9px;color:#9a9dad;font-size:10px;font-weight:800;letter-spacing:.12em}.shelf{display:flex;flex-direction:column;gap:7px}.shelf-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px;border:1px solid transparent;border-radius:12px;text-align:left;background:transparent;cursor:pointer;transition:.2s}.shelf-item:hover{background:#f7f7fb}.shelf-item.active{border-color:#d6d2fb;background:var(--soft)}.mini-cover{display:grid;place-items:center;flex:0 0 34px;height:44px;border-radius:7px;color:#fff;background:var(--theme);font-family:Georgia,serif;font-size:13px;box-shadow:0 4px 10px rgba(30,30,60,.12)}.shelf-copy{min-width:0}.shelf-copy strong,.shelf-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shelf-copy strong{font-size:12px}.shelf-copy small{margin-top:4px;color:var(--muted);font-size:10px}.history-dot{flex:0 0 6px;width:6px;height:6px;margin-left:auto;border-radius:50%;background:var(--primary)}
    .workspace{min-height:720px;overflow:hidden}.workspace-header{display:flex;align-items:center;justify-content:space-between;padding:23px 26px 18px;border-bottom:1px solid var(--line)}.workspace-header h2{margin:0;font-size:20px}.workspace-header p{margin:5px 0 0;color:var(--muted);font-size:12px}.ghost-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border:0;border-radius:10px;color:var(--muted);background:transparent;cursor:pointer}.ghost-btn:hover{color:var(--primary);background:var(--soft)}.workspace-body{min-height:650px}
    .question-view{padding:36px}.intro-badge{display:inline-flex;padding:7px 10px;border-radius:999px;color:var(--primary-dark);background:var(--soft);font-size:11px;font-weight:700}.question-view>h3{margin:17px 0 9px;font-size:clamp(25px,3vw,33px);letter-spacing:-.035em}.question-view>p{margin:0 0 25px;color:var(--muted);font-size:13px}.questions{display:grid;grid-template-columns:1fr 1fr;gap:13px}.question-card{position:relative;min-height:140px;padding:18px;text-align:left;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.72);cursor:pointer;transition:.2s}.question-card:hover{transform:translateY(-3px);border-color:#c5c0fa;box-shadow:0 13px 26px rgba(55,48,137,.09)}.question-card.active{border-color:var(--primary);background:var(--soft)}.question-number{display:grid;place-items:center;width:28px;height:28px;margin-bottom:15px;border-radius:8px;color:var(--primary);background:var(--soft);font-size:11px;font-weight:800}.question-card.active .question-number{color:#fff;background:var(--primary)}.question-card strong{display:block;padding-right:24px;font-size:14px;line-height:1.5}.question-card small{display:block;margin-top:6px;color:var(--muted);font-size:11px}.question-arrow{position:absolute;top:18px;right:17px;color:#a9adbc}.saved-mark{position:absolute;right:16px;bottom:14px;color:var(--primary);font-size:9px}.empty-state{display:grid;place-items:center;min-height:480px;padding:50px;text-align:center}.empty-icon{display:grid;place-items:center;width:64px;height:64px;margin:auto;border-radius:20px;color:var(--primary);background:var(--soft);font-size:27px}.empty-state h3{margin:18px 0 8px}.empty-state p{max-width:360px;margin:0;color:var(--muted);font-size:13px;line-height:1.7}
    .workspace.chatting .workspace-body{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:720px}.workspace.chatting .question-view{padding:16px 13px;border-right:1px solid var(--line);background:#fafafd}.workspace.chatting .question-view>.intro-badge,.workspace.chatting .question-view>h3,.workspace.chatting .question-view>p{display:none}.workspace.chatting .questions{grid-template-columns:1fr;gap:8px}.workspace.chatting .question-card{min-height:0;padding:12px;border-radius:12px}.workspace.chatting .question-number{width:24px;height:24px;margin-bottom:8px}.workspace.chatting .question-card strong{padding-right:4px;font-size:11px}.workspace.chatting .question-card small{font-size:9px}.workspace.chatting .question-arrow{display:none}.workspace.chatting .saved-mark{right:10px;bottom:9px}
    .chat-view{display:none;flex-direction:column;height:720px}.chat-view.active{display:flex}.chat-topic{padding:15px 25px;border-bottom:1px solid var(--line);background:#fafafd}.chat-topic span{color:var(--primary);font-size:10px;font-weight:800;letter-spacing:.08em}.chat-topic p{margin:5px 0 0;font-size:13px;font-weight:700}.messages{flex:1;overflow-y:auto;padding:24px 25px;scrollbar-width:thin}.message{display:flex;gap:10px;margin-bottom:19px;animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(5px)}}.message.user{justify-content:flex-end}.avatar{display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border-radius:9px;color:#fff;background:var(--primary);font-size:12px}.bubble{max-width:min(78%,560px);padding:12px 15px;border-radius:7px 16px 16px 16px;color:#393b4c;background:#f0f1f6;font-size:13px;line-height:1.72;white-space:pre-wrap}.message.user .bubble{order:-1;color:#fff;border-radius:16px 7px 16px 16px;background:linear-gradient(135deg,#665de9,#544ad3)}.thinking{display:inline-flex;gap:4px;padding:6px}.thinking i{width:5px;height:5px;border-radius:50%;background:#999cad;animation:bounce 1s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}@keyframes bounce{50%{transform:translateY(-4px)}}.suggestions{display:flex;gap:7px;overflow-x:auto;padding:0 25px 11px;scrollbar-width:none}.suggestion{flex:0 0 auto;padding:7px 11px;border:1px solid #dddbef;border-radius:999px;color:#5c5b70;background:#fff;font-size:11px;cursor:pointer}.suggestion:hover{color:var(--primary);background:var(--soft)}.composer{margin:0 17px 17px;padding:9px 9px 9px 14px;border:1px solid #dddee8;border-radius:16px;background:#fff;box-shadow:0 9px 25px rgba(34,35,61,.07)}.composer:focus-within{border-color:#aaa4f3;box-shadow:0 0 0 3px rgba(96,87,231,.08)}textarea{width:100%;min-height:43px;max-height:110px;padding:6px 2px;resize:none;border:0;outline:0;color:var(--ink);background:transparent;line-height:1.5}.composer-foot{display:flex;align-items:center;justify-content:space-between}.hint{color:#a1a4b2;font-size:10px}.send-btn,.primary-btn{border:0;border-radius:11px;color:#fff;background:var(--primary);font-weight:700;cursor:pointer}.send-btn{padding:9px 14px}.send-btn:disabled{opacity:.42;cursor:not-allowed}
    dialog{width:min(650px,calc(100% - 28px));max-height:90vh;padding:0;border:0;border-radius:22px;background:#fff;box-shadow:0 30px 90px rgba(24,21,65,.25)}dialog::backdrop{background:rgba(25,24,40,.44);backdrop-filter:blur(4px)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:21px 23px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px}.close-btn{width:32px;height:32px;border:0;border-radius:9px;color:var(--muted);background:#f5f5f8;cursor:pointer}.tabs{display:flex;gap:5px;margin:20px 22px 0;padding:4px;border-radius:12px;background:#f4f4f8}.tab-btn{flex:1;padding:9px;border:0;border-radius:9px;color:var(--muted);background:transparent;cursor:pointer}.tab-btn.active{color:var(--ink);background:#fff;box-shadow:0 3px 9px rgba(0,0,0,.06);font-weight:700}.modal-body{padding:19px 22px 23px}.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.preset-card{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer}.preset-card:hover{border-color:#bab4f5;background:#faf9ff}.preset-card:disabled{opacity:.5;cursor:not-allowed}.preset-cover{display:grid;place-items:center;flex:0 0 47px;height:62px;border-radius:8px;color:#fff;background:var(--theme);font-family:Georgia,serif}.preset-card strong,.preset-card small{display:block}.preset-card small{margin-top:5px;color:var(--muted);font-size:11px}.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;outline:0;background:#fbfbfd}.field input:focus,.field textarea:focus{border-color:#aaa4f3}.field textarea{min-height:85px}.primary-btn{justify-self:end;padding:11px 18px}.toast{position:fixed;left:50%;bottom:24px;z-index:9;transform:translate(-50%,20px);padding:10px 15px;border-radius:10px;color:#fff;background:#242532;font-size:12px;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:840px){.app{width:min(100% - 24px,700px)}.layout{grid-template-columns:1fr}.library{position:static}.library-main{display:grid;grid-template-columns:160px 1fr;gap:15px}.current-cover{min-height:175px}.book-summary{padding-top:5px}.shelf{flex-direction:row;overflow-x:auto;scrollbar-width:none}.shelf-item{flex:0 0 165px}.workspace.chatting .workspace-body{grid-template-columns:205px minmax(0,1fr)}}
    @media(max-width:560px){.app{width:100%;padding:13px 11px 20px}.topbar{margin-bottom:14px}.status span:last-child{display:none}.library{padding:14px;border-radius:18px}.library-main{grid-template-columns:105px 1fr}.current-cover{min-height:140px;padding:13px}.current-cover h1{margin-top:28px;font-size:19px}.cover-author{font-size:9px}.cover-symbol{font-size:26px}.book-summary p{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}.workspace{border-radius:18px}.workspace-header{padding:17px}.workspace-header h2{font-size:17px}.ghost-btn span:last-child{display:none}.question-view{padding:25px 16px}.questions{grid-template-columns:1fr}.workspace.chatting .workspace-body{display:flex;flex-direction:column}.workspace.chatting .question-view{padding:10px;border-right:0;border-bottom:1px solid var(--line)}.workspace.chatting .questions{display:flex;overflow-x:auto;scrollbar-width:none}.workspace.chatting .question-card{flex:0 0 174px;min-height:89px}.chat-view{height:calc(100vh - 240px);min-height:470px}.messages{padding:18px 14px}.bubble{max-width:87%}.suggestions{padding-left:14px}.composer{margin:0 9px 9px}.hint{display:none}.preset-grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H11v16H7.5A2.5 2.5 0 0 0 5 21.5v-16Zm14 0A2.5 2.5 0 0 0 16.5 3H13v16h3.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" stroke="currentColor" stroke-width="1.7"/></svg></span>读页</div><div class="status"><span class="status-dot"></span><span>AI 阅读伙伴在线</span></div></header>
    <div class="layout">
      <aside class="panel library">
        <div class="library-head"><h2>我的书架</h2><button class="add-btn" id="openModal" title="添加图书" aria-label="添加图书">＋</button></div>
        <div class="library-main">
          <div class="current-cover" id="cover"><span class="cover-kicker" id="coverKicker"></span><h1 id="coverTitle"></h1><span class="cover-author" id="coverAuthor"></span><span class="cover-symbol" id="coverSymbol"></span></div>
          <div class="book-summary"><p id="bookDescription"></p><div class="progress-row"><span>阅读进度</span><strong id="progressText"></strong></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div>
        </div>
        <div class="shelf-label">书架中的图书</div><div class="shelf" id="shelf"></div>
      </aside>
      <section class="panel workspace" id="workspace" aria-live="polite">
        <header class="workspace-header"><div><h2 id="workspaceTitle"></h2><p id="subtitle"></p></div><button class="ghost-btn hidden" id="backBtn"><span>←</span><span>返回问题</span></button></header>
        <div class="workspace-body">
          <div class="question-view" id="questionView"><span class="intro-badge" id="badge"></span><h3>阅读不止于合上书页</h3><p>选择一个触动你的问题。这里没有标准答案，只有值得展开的想法。</p><div class="questions" id="questions"></div></div>
          <div class="empty-state hidden" id="emptyState"><div><span class="empty-icon">⌛</span><h3>问题正在酝酿中</h3><p>这本书已经加入书架，但还没有生成讨论问题。未来接入真实 AI 后，问题卡片会出现在这里。</p></div></div>
          <div class="chat-view" id="chatView"><div class="chat-topic"><span>正在讨论</span><p id="activeQuestion"></p></div><div class="messages" id="messages"></div><div class="suggestions" id="suggestions"></div><form class="composer" id="composer"><textarea id="input" rows="1" maxlength="500" placeholder="写下你的理解……" aria-label="聊天输入框"></textarea><div class="composer-foot"><span class="hint">Enter 发送 · Shift + Enter 换行</span><button class="send-btn" id="sendBtn" disabled>发送 ↑</button></div></form></div>
        </div>
      </section>
    </div>
  </main>

  <dialog id="bookModal"><div class="modal-head"><h2>添加一本图书</h2><button class="close-btn" id="closeModal" aria-label="关闭">×</button></div><div class="tabs"><button class="tab-btn active" data-tab="preset">从书库选择</button><button class="tab-btn" data-tab="custom">手动添加</button></div><div class="modal-body"><div id="presetPane"><div class="preset-grid" id="presetGrid"></div></div><form class="form hidden" id="customPane"><div class="field"><label for="customTitle">书名 *</label><input id="customTitle" maxlength="40" required placeholder="例如：月亮与六便士"></div><div class="field"><label for="customAuthor">作者</label><input id="customAuthor" maxlength="40" placeholder="作者姓名"></div><div class="field"><label for="customDescription">简介</label><textarea id="customDescription" maxlength="180" placeholder="简单介绍这本书……"></textarea></div><button class="primary-btn">加入书架</button></form></div></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const PRESETS={
      prince:{id:"prince",title:"小王子",author:"安托万·德·圣埃克苏佩里",kicker:"LE PETIT PRINCE",symbol:"✦",theme:"linear-gradient(150deg,#27253a,#655be3)",description:"一场跨越星球的旅行，一次关于爱、责任与成长的温柔追问。",progress:68,source:"preset",questions:[
        {id:"leave",tag:"人物与选择",text:"小王子为什么决定离开自己的星球？",prompt:"说说你觉得他真正想逃离的是什么？",answer:"小王子的离开不只是因为与玫瑰闹了别扭。更深一层看，他还不懂该怎样面对爱里的骄傲、误解和责任，于是选择用旅行寻找答案。\n\n离开有时并非放弃，而是一个人尚未学会留下。"},
        {id:"tame",tag:"关系与成长",text:"狐狸所说的“驯养”意味着什么？",prompt:"在你看来，建立关系会带来什么改变？",answer:"“驯养”可以理解为建立联结。因为投入时间、耐心和关注，两个普通的存在才变得不可替代。联结带来快乐，也意味着愿意承担责任。"},
        {id:"rose",tag:"爱与责任",text:"玫瑰对小王子来说究竟代表什么？",prompt:"她为什么能与花园里成千上万朵玫瑰不同？",answer:"玫瑰代表一段被亲自照料过的关系。真正让她独特的不是外表，而是小王子投入其中的时间与感情。爱不是发现完美，而是共同创造独一无二。"},
        {id:"numbers",tag:"成人世界",text:"为什么成年人总喜欢用数字理解世界？",prompt:"数字让人更接近真相，还是更容易忽略真相？",answer:"数字提供确定感，但只相信可量化的信息，会让感受、关系与想象力被排除。数字可以描述事物，却未必能解释它为什么值得珍惜。"}]},
      sapiens:{id:"sapiens",title:"人类简史",author:"尤瓦尔·赫拉利",kicker:"SAPIENS",symbol:"◉",theme:"linear-gradient(150deg,#182a37,#317b77)",description:"从认知革命到科技革命，重新审视智人如何塑造共同的世界。",progress:34,source:"preset",questions:[
        {id:"fiction",tag:"认知革命",text:"共同想象为什么能让陌生人大规模合作？",prompt:"你能想到哪些依靠共同相信才能运转的事物？",answer:"共同想象让互不相识的人共享规则、身份和目标。国家、货币与公司都不是单靠物理实体运转，而是依靠许多人共同接受一套叙事。"},
        {id:"agri",tag:"农业革命",text:"农业革命为什么被称为“史上最大骗局”？",prompt:"粮食增加是否一定意味着个体生活得更好？",answer:"农业提高了总人口和食物产量，却可能让普通人的劳动更繁重、饮食更单一。作者借此区分物种层面的成功与个体生活质量。"},
        {id:"money",tag:"社会秩序",text:"为什么货币是最普遍也最有效的互信系统？",prompt:"不共享宗教与文化的人，为什么仍愿意接受同一种货币？",answer:"货币把价值转化为可交换的共同尺度。人们不必彼此信任，只需相信其他人也会认可这种媒介，因此它能跨越文化与信仰。"},
        {id:"happy",tag:"历史与幸福",text:"历史进步是否真的让人类更加幸福？",prompt:"衡量文明进步时，我们忽略了哪些感受？",answer:"技术、财富与权力的增长并不自动等于幸福提升。作者提醒我们把主观体验、期待变化与其他物种的处境也纳入衡量。"}]},
      nineteen84:{id:"nineteen84",title:"1984",author:"乔治·奥威尔",kicker:"NINETEEN EIGHTY-FOUR",symbol:"◎",theme:"linear-gradient(150deg,#271b22,#9a3843)",description:"一个关于权力、语言与真实的警示故事：当思想本身也被监视。",progress:51,source:"preset",questions:[
        {id:"language",tag:"语言与思想",text:"“新话”为什么能成为控制思想的工具？",prompt:"如果一个词消失了，对应的思想还容易被表达吗？",answer:"“新话”通过缩减词汇来压缩可思考、可表达的范围。它不只是禁止说某些话，而是试图让反抗性的概念最终变得难以形成。"},
        {id:"truth",tag:"真实与记忆",text:"谁控制过去，为什么就可能控制未来？",prompt:"集体记忆被不断修改时，人还能依据什么判断真实？",answer:"当历史记录可以被持续改写，权力就能塑造人们理解现在的依据，并让自己的选择显得永远正确。个人记忆因此成为脆弱却重要的抵抗。"},
        {id:"watch",tag:"监视与自律",text:"持续监视如何让人主动约束自己？",prompt:"真正有效的控制是否需要时时有人观看？",answer:"当人无法确定自己何时被观察，就会把外部监视内化为自我审查。控制因此不必每时每刻发生，却能持续影响行为。"},
        {id:"love",tag:"人性与权力",text:"温斯顿与朱莉娅的关系为什么具有反抗意义？",prompt:"私人感情为何会威胁一个要求绝对忠诚的体制？",answer:"私人感情创造了不受权力完全支配的忠诚与意义。它让个体把另一个具体的人置于抽象体制之前，因此天然构成边界与反抗。"}]}
    };
    const STORAGE="readpage_shelf_v2",followUps=["这和现实生活有什么关系？","能换一个角度解释吗？","书中还有哪些细节？"];
    const state={books:[],activeBookId:null,activeQuestions:{},bookViews:{},chats:{},busy:false};
    const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
    function loadShelf(){let raw;try{raw=JSON.parse(localStorage.getItem(STORAGE)||"[]")}catch(e){raw=[]}if(!Array.isArray(raw)||!raw.length)raw=[{id:"prince",source:"preset"}];state.books=raw.map(x=>x.source==="preset"&&PRESETS[x.id]?clone(PRESETS[x.id]):x).filter(x=>x&&x.id);state.activeBookId=state.books[0].id}
    function saveShelf(){localStorage.setItem(STORAGE,JSON.stringify(state.books.map(b=>b.source==="preset"?{id:b.id,source:"preset"}:b)))}
    function book(){return state.books.find(b=>b.id===state.activeBookId)}function chatKey(qid){return `${state.activeBookId}::${qid}`}
    function hasBookHistory(id){return Object.keys(state.chats).some(k=>k.startsWith(id+"::")&&state.chats[k].messages.length>1)}
    function render(){const b=book();$("#cover").style.setProperty("--theme",b.theme);$("#coverKicker").textContent=b.kicker||"MY READING";$("#coverTitle").textContent=b.title;$("#coverAuthor").textContent=b.author||"作者未填写";$("#coverSymbol").textContent=b.symbol||"✦";$("#bookDescription").textContent=b.description||"这本书还没有简介。";$("#progressText").textContent=`${b.progress||0}%`;$("#progressBar").style.width=`${b.progress||0}%`;$("#workspaceTitle").textContent=`和《${b.title}》聊一聊`;renderShelf();renderQuestions();renderView()}
    function renderShelf(){$("#shelf").innerHTML=state.books.map(b=>`<button class="shelf-item ${b.id===state.activeBookId?"active":""}" data-book="${escapeHtml(b.id)}"><span class="mini-cover" style="--theme:${b.theme}">${escapeHtml(b.title.slice(0,1))}</span><span class="shelf-copy"><strong>${escapeHtml(b.title)}</strong><small>${escapeHtml(b.author||"作者未填写")}</small></span>${hasBookHistory(b.id)?'<i class="history-dot" title="有聊天记录"></i>':""}</button>`).join("")}
    function renderQuestions(){const b=book();$("#badge").textContent=`✦ AI 为你准备了 ${b.questions.length} 个问题`;$("#questions").innerHTML=b.questions.map((q,i)=>{const saved=state.chats[chatKey(q.id)]?.messages.length>1;return `<button class="question-card ${state.activeQuestions[b.id]===q.id?"active":""}" data-question="${q.id}"><span class="question-number">${String(i+1).padStart(2,"0")}</span><strong>${escapeHtml(q.text)}</strong><small>${escapeHtml(q.tag)}</small><span class="question-arrow">→</span>${saved?'<span class="saved-mark">● 有对话</span>':""}</button>`}).join("")}
    function renderView(){const b=book(),qid=state.activeQuestions[b.id],chatting=!!state.bookViews[b.id]&&!!qid;if(!b.questions.length){$("#workspace").classList.remove("chatting");$("#questionView").classList.add("hidden");$("#emptyState").classList.remove("hidden");$("#chatView").classList.remove("active");$("#backBtn").classList.add("hidden");$("#subtitle").textContent="问题尚未生成";return}$("#emptyState").classList.add("hidden");$("#questionView").classList.remove("hidden");$("#workspace").classList.toggle("chatting",chatting);$("#chatView").classList.toggle("active",chatting);$("#backBtn").classList.toggle("hidden",!chatting);$("#subtitle").textContent=chatting?"你的每段讨论都会在本次访问中保留":"从一个感兴趣的问题开始";if(chatting)restoreChat(qid)}
    function openQuestion(qid){const b=book(),q=b.questions.find(x=>x.id===qid);state.activeQuestions[b.id]=qid;state.bookViews[b.id]=true;const key=chatKey(qid);if(!state.chats[key])state.chats[key]={messages:[{role:"ai",text:`${q.prompt}\n\n不用担心答得是否正确，我更想听听你的真实理解。`}],first:true,replyIndex:0};renderQuestions();renderView();setTimeout(()=>$("#input").focus(),100)}
    function restoreChat(qid){const q=book().questions.find(x=>x.id===qid),session=state.chats[chatKey(qid)];$("#activeQuestion").textContent=q.text;$("#messages").innerHTML=session.messages.map(m=>messageHTML(m.role,m.text)).join("");$("#messages").scrollTop=$("#messages").scrollHeight;renderSuggestions(session.first?["我还没想好，给我一点提示","先看看这个问题的背景"]:followUps);$("#input").value="";$("#input").placeholder=session.first?"写下你的理解……":"继续追问，或分享新的想法……";$("#sendBtn").disabled=true}
    function messageHTML(role,text,thinking=false){return `<div class="message ${role}">${role==="ai"?'<div class="avatar">✦</div>':""}<div class="bubble">${thinking?'<span class="thinking"><i></i><i></i><i></i></span>':escapeHtml(text)}</div></div>`}
    function renderSuggestions(items){$("#suggestions").innerHTML=items.map(x=>`<button class="suggestion" data-suggestion="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join("")}
    function replyFor(q,text,session){const t=text.toLowerCase();if(session.first){session.first=false;return q.answer}if(t.includes("现实")||t.includes("生活"))return `放到现实中看，“${q.tag}”并不只存在于书里。我们每天如何相信、选择和建立关系，都在重复这个问题。你可以试着找一个最近亲身经历的例子。`;if(t.includes("角度"))return `换一个角度，先不判断作者是否正确，而是问：如果故事中的人做出相反选择，会失去什么、又会得到什么？这个反事实问题常常能照亮作者真正关心的部分。`;if(t.includes("细节")||t.includes("书中"))return `可以留意人物前后态度的变化、反复出现的意象，以及叙述者刻意强调的对比。这些细节共同支撑了“${q.tag}”这一主题。`;session.replyIndex++;return `你的理解抓住了一个重要入口。${q.answer.split("。")[0]}。如果再往前一步，你觉得作者是在给出答案，还是邀请读者保持警惕？`}
    function send(text){const value=text.trim(),b=book(),qid=state.activeQuestions[b.id];if(!value||state.busy||!qid)return;const session=state.chats[chatKey(qid)],q=b.questions.find(x=>x.id===qid);session.messages.push({role:"user",text:value});$("#messages").insertAdjacentHTML("beforeend",messageHTML("user",value));$("#input").value="";state.busy=true;$("#sendBtn").disabled=true;$("#suggestions").innerHTML="";$("#messages").insertAdjacentHTML("beforeend",messageHTML("ai","",true));$("#messages").scrollTop=$("#messages").scrollHeight;setTimeout(()=>{$("#messages").lastElementChild.remove();const answer=replyFor(q,value,session);session.messages.push({role:"ai",text:answer});$("#messages").insertAdjacentHTML("beforeend",messageHTML("ai",answer));state.busy=false;renderSuggestions(followUps);renderQuestions();renderShelf();$("#input").placeholder="继续追问，或分享新的想法……";$("#input").focus();$("#messages").scrollTop=$("#messages").scrollHeight},700)}
    function switchBook(id){state.activeBookId=id;render()}
    function renderPresetGrid(){$("#presetGrid").innerHTML=Object.values(PRESETS).map(b=>{const added=state.books.some(x=>x.id===b.id);return `<button class="preset-card" data-add-preset="${b.id}" ${added?"disabled":""}><span class="preset-cover" style="--theme:${b.theme}">${b.title[0]}</span><span><strong>${b.title}</strong><small>${added?"已在书架中":b.author}</small></span></button>`}).join("")}
    function addPreset(id){if(state.books.some(b=>b.id===id))return toast("这本书已经在书架中了");state.books.push(clone(PRESETS[id]));state.activeBookId=id;saveShelf();$("#bookModal").close();render();toast("已加入书架")}
    function addCustom(e){e.preventDefault();const title=$("#customTitle").value.trim(),author=$("#customAuthor").value.trim(),description=$("#customDescription").value.trim();if(!title)return;if(state.books.some(b=>b.title.toLowerCase()===title.toLowerCase()))return toast("同名图书已经在书架中了");const colors=["linear-gradient(150deg,#29354d,#6577a8)","linear-gradient(150deg,#402b35,#a25e6b)","linear-gradient(150deg,#273a31,#5f9273)"];const b={id:`custom-${Date.now()}`,title,author,kicker:"MY READING",symbol:"✦",theme:colors[state.books.length%colors.length],description,progress:0,source:"custom",questions:[]};state.books.push(b);state.activeBookId=b.id;saveShelf();e.target.reset();$("#bookModal").close();render();toast("已加入书架，等待生成问题")}
    function escapeHtml(v){const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML}function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),1700)}
    $("#shelf").addEventListener("click",e=>{const b=e.target.closest("[data-book]");if(b)switchBook(b.dataset.book)});$("#questions").addEventListener("click",e=>{const q=e.target.closest("[data-question]");if(q)openQuestion(q.dataset.question)});$("#backBtn").addEventListener("click",()=>{state.bookViews[state.activeBookId]=false;renderView()});$("#composer").addEventListener("submit",e=>{e.preventDefault();send($("#input").value)});$("#input").addEventListener("input",e=>{$("#sendBtn").disabled=state.busy||!e.target.value.trim();e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,110)+"px"});$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(e.target.value)}});$("#suggestions").addEventListener("click",e=>{const b=e.target.closest("[data-suggestion]");if(b)send(b.dataset.suggestion)});
    $("#openModal").addEventListener("click",()=>{renderPresetGrid();$("#bookModal").showModal()});$("#closeModal").addEventListener("click",()=>$("#bookModal").close());$("#bookModal").addEventListener("click",e=>{if(e.target===$("#bookModal"))$("#bookModal").close()});document.querySelectorAll(".tab-btn").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active",x===btn));$("#presetPane").classList.toggle("hidden",btn.dataset.tab!=="preset");$("#customPane").classList.toggle("hidden",btn.dataset.tab!=="custom")}));$("#presetGrid").addEventListener("click",e=>{const b=e.target.closest("[data-add-preset]");if(b)addPreset(b.dataset.addPreset)});$("#customPane").addEventListener("submit",addCustom);
    loadShelf();render();
  </script>
