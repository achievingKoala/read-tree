<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="《小王子》AI 阅读助手互动演示">
  <title>读页 · AI 阅读助手</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --surface: rgba(255, 255, 255, .86);
      --surface-solid: #fff;
      --ink: #171927;
      --muted: #74798d;
      --line: #e8e9f1;
      --primary: #6057e7;
      --primary-dark: #4941cc;
      --primary-soft: #efedff;
      --warm: #ffb454;
      --shadow: 0 20px 60px rgba(43, 39, 94, .09);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 4% 8%, rgba(102, 91, 237, .1), transparent 28%),
        radial-gradient(circle at 95% 96%, rgba(255, 180, 84, .12), transparent 27%),
        var(--bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(1180px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .brand { display: flex; align-items: center; gap: 11px; font-weight: 750; letter-spacing: -.02em; }
    .brand-mark {
      display: grid; place-items: center;
      width: 38px; height: 38px;
      color: white; border-radius: 12px;
      background: linear-gradient(135deg, #7168f2, #5047d5);
      box-shadow: 0 8px 20px rgba(96, 87, 231, .26);
    }
    .brand-mark svg { width: 21px; }
    .ai-status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #31bf7c; box-shadow: 0 0 0 5px rgba(49,191,124,.1); }

    .layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; align-items: start; }
    .panel { border: 1px solid rgba(232,233,241,.88); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(16px); }

    .book-panel { position: sticky; top: 24px; padding: 22px; }
    .cover {
      position: relative; overflow: hidden;
      height: 260px; padding: 28px;
      border-radius: 17px; color: #fff;
      background: linear-gradient(155deg, #242338 0%, #302d63 56%, #685be2 100%);
      box-shadow: 0 18px 36px rgba(47, 43, 101, .22);
    }
    .cover::before { content: ""; position: absolute; width: 180px; height: 180px; right: -57px; top: -48px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; box-shadow: 0 0 0 24px rgba(255,255,255,.035), 0 0 0 48px rgba(255,255,255,.025); }
    .cover::after { content: "✦"; position: absolute; right: 37px; bottom: 34px; color: var(--warm); font-size: 58px; filter: drop-shadow(0 5px 10px rgba(0,0,0,.18)); }
    .cover-kicker { position: relative; font-size: 11px; letter-spacing: .2em; color: rgba(255,255,255,.6); }
    .cover h1 { position: relative; margin: 50px 0 9px; font-family: Georgia, "Songti SC", serif; font-size: 38px; font-weight: 600; letter-spacing: .08em; }
    .cover-author { position: relative; color: rgba(255,255,255,.66); font-size: 13px; }
    .book-meta { padding: 22px 4px 2px; }
    .book-meta h2 { margin: 0 0 8px; font-size: 19px; }
    .book-meta p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .progress-row { display: flex; justify-content: space-between; margin-top: 20px; font-size: 12px; color: var(--muted); }
    .progress-track { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 9px; background: #ececf2; }
    .progress-bar { width: 68%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #8c83f7); }

    .workspace { min-height: 720px; overflow: hidden; }
    .workspace-body { display: block; min-height: 650px; }
    .workspace-header { display: flex; justify-content: space-between; align-items: center; padding: 25px 28px 20px; border-bottom: 1px solid var(--line); }
    .workspace-header h2 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    .workspace-header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .ghost-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; cursor: pointer; transition: .2s; }
    .ghost-btn:hover { color: var(--primary); background: var(--primary-soft); }

    .question-view { padding: 38px 38px 42px; }
    .intro-badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 999px; color: var(--primary-dark); background: var(--primary-soft); font-size: 12px; font-weight: 650; }
    .question-view h3 { max-width: 550px; margin: 18px 0 10px; font-size: clamp(25px, 3vw, 34px); line-height: 1.28; letter-spacing: -.035em; }
    .question-view > p { margin: 0 0 28px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .questions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .question-card { position: relative; min-height: 150px; padding: 19px; text-align: left; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.7); cursor: pointer; transition: transform .22s, border-color .22s, box-shadow .22s; }
    .question-card:hover { transform: translateY(-3px); border-color: #c9c5fb; box-shadow: 0 14px 28px rgba(55, 48, 137, .09); }
    .question-card.active { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 10px 24px rgba(96, 87, 231, .12); }
    .question-number { display: grid; place-items: center; width: 29px; height: 29px; margin-bottom: 17px; border-radius: 9px; color: var(--primary); background: var(--primary-soft); font-size: 12px; font-weight: 750; }
    .question-card strong { display: block; padding-right: 28px; font-size: 15px; line-height: 1.55; }
    .question-card small { display: block; margin-top: 7px; color: var(--muted); }
    .question-arrow { position: absolute; top: 20px; right: 18px; color: #aaaec0; font-size: 19px; transition: .2s; }
    .question-card:hover .question-arrow { color: var(--primary); transform: translateX(3px); }

    .workspace.chatting .workspace-body { display: grid; grid-template-columns: 226px minmax(0, 1fr); min-height: 720px; }
    .workspace.chatting .question-view { padding: 18px 14px; border-right: 1px solid var(--line); background: rgba(249,249,253,.62); }
    .workspace.chatting .question-view > .intro-badge,
    .workspace.chatting .question-view > h3,
    .workspace.chatting .question-view > p { display: none; }
    .workspace.chatting .questions { grid-template-columns: 1fr; gap: 9px; }
    .workspace.chatting .question-card { min-height: 0; padding: 14px 12px; border-radius: 13px; }
    .workspace.chatting .question-card:hover { transform: translateX(2px); }
    .workspace.chatting .question-number { width: 25px; height: 25px; margin-bottom: 10px; }
    .workspace.chatting .question-card strong { padding-right: 13px; font-size: 12px; line-height: 1.5; }
    .workspace.chatting .question-card small { margin-top: 5px; font-size: 10px; }
    .workspace.chatting .question-arrow { display: none; }

    .chat-view { display: none; flex-direction: column; height: 720px; }
    .chat-view.active { display: flex; }
    .chat-topic { padding: 16px 28px; border-bottom: 1px solid var(--line); background: rgba(249,249,253,.7); }
    .chat-topic span { color: var(--primary); font-size: 11px; font-weight: 750; letter-spacing: .08em; }
    .chat-topic p { margin: 5px 0 0; font-size: 14px; font-weight: 650; }
    .messages { flex: 1; overflow-y: auto; padding: 27px 28px; scrollbar-width: thin; }
    .message { display: flex; gap: 11px; margin-bottom: 22px; animation: messageIn .32s ease both; }
    @keyframes messageIn { from { opacity: 0; transform: translateY(7px); } }
    .message.user { justify-content: flex-end; }
    .avatar { flex: 0 0 auto; display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; color: white; background: linear-gradient(135deg, #7168f2, #5047d5); font-size: 13px; }
    .bubble { max-width: min(76%, 560px); padding: 13px 16px; border-radius: 7px 17px 17px 17px; color: #393b4c; background: #f0f1f6; font-size: 14px; line-height: 1.75; white-space: pre-wrap; }
    .message.user .bubble { order: -1; color: white; border-radius: 17px 7px 17px 17px; background: linear-gradient(135deg, #655ce8, #554bd4); }
    .thinking { display: inline-flex; gap: 5px; align-items: center; height: 22px; }
    .thinking i { width: 6px; height: 6px; border-radius: 50%; background: #9b9daf; animation: bounce 1.1s infinite; }
    .thinking i:nth-child(2) { animation-delay: .15s; }
    .thinking i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

    .suggestions { display: flex; gap: 8px; overflow-x: auto; padding: 0 28px 13px; scrollbar-width: none; }
    .suggestion { flex: 0 0 auto; padding: 8px 12px; border: 1px solid #deddf0; border-radius: 999px; color: #5d5c72; background: #fff; font-size: 12px; cursor: pointer; transition: .2s; }
    .suggestion:hover { color: var(--primary); border-color: #bdb8f6; background: var(--primary-soft); }
    .composer { margin: 0 20px 20px; padding: 10px 10px 10px 16px; border: 1px solid #dedfe8; border-radius: 17px; background: #fff; box-shadow: 0 10px 30px rgba(34, 35, 61, .07); transition: .2s; }
    .composer:focus-within { border-color: #aaa4f3; box-shadow: 0 10px 30px rgba(96,87,231,.12), 0 0 0 3px rgba(96,87,231,.08); }
    textarea { width: 100%; min-height: 46px; max-height: 120px; padding: 7px 3px; resize: none; border: 0; outline: 0; color: var(--ink); background: transparent; line-height: 1.55; }
    textarea::placeholder { color: #a5a8b6; }
    .composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .composer-hint { color: #a1a4b2; font-size: 11px; }
    .send-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 88px; padding: 10px 15px; border: 0; border-radius: 12px; color: white; background: var(--primary); font-weight: 650; cursor: pointer; transition: .2s; }
    .send-btn:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
    .send-btn:disabled { opacity: .45; cursor: not-allowed; }

    .hidden { display: none !important; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 5; transform: translate(-50%, 20px); padding: 10px 15px; border-radius: 11px; color: white; background: #242532; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 820px) {
      .app { width: min(100% - 24px, 680px); padding-top: 18px; }
      .layout { grid-template-columns: 1fr; }
      .book-panel { position: static; display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 16px; }
      .cover { height: 190px; padding: 19px; }
      .cover h1 { margin-top: 32px; font-size: 25px; }
      .cover::after { right: 22px; bottom: 25px; font-size: 38px; }
      .book-meta { padding: 10px 4px 0; }
      .workspace { min-height: auto; }
      .chat-view { height: 690px; }
      .workspace.chatting .workspace-body { grid-template-columns: 210px minmax(0, 1fr); min-height: 690px; }
    }

    @media (max-width: 560px) {
      .app { width: 100%; padding: 14px 12px 22px; }
      .topbar { margin-bottom: 16px; padding: 0 3px; }
      .ai-status span:last-child { display: none; }
      .book-panel { grid-template-columns: 102px 1fr; gap: 13px; border-radius: 18px; }
      .cover { height: 142px; padding: 14px; border-radius: 13px; }
      .cover-kicker { font-size: 8px; }
      .cover h1 { margin: 25px 0 5px; font-size: 20px; }
      .cover-author { font-size: 10px; }
      .cover::after { right: 14px; bottom: 15px; font-size: 27px; }
      .book-meta { padding-top: 4px; }
      .book-meta h2 { font-size: 16px; }
      .book-meta p { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 11px; }
      .progress-row { margin-top: 14px; }
      .workspace { border-radius: 18px; }
      .workspace-header { padding: 19px 17px 16px; }
      .workspace-header h2 { font-size: 18px; }
      .workspace-header p { font-size: 11px; }
      .ghost-btn { padding: 8px; }
      .ghost-btn span { display: none; }
      .question-view { padding: 26px 17px 24px; }
      .question-view h3 { font-size: 26px; }
      .questions { grid-template-columns: 1fr; }
      .question-card { min-height: 126px; }
      .workspace.chatting .workspace-body { display: flex; flex-direction: column; min-height: 0; }
      .workspace.chatting .question-view { flex: 0 0 auto; padding: 11px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
      .workspace.chatting .questions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; }
      .workspace.chatting .question-card { flex: 0 0 178px; min-height: 92px; padding: 11px; }
      .workspace.chatting .question-number { margin-bottom: 7px; }
      .workspace.chatting .question-card strong { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .chat-view { height: calc(100vh - 245px); min-height: 480px; }
      .chat-topic { padding: 13px 17px; }
      .messages { padding: 20px 16px; }
      .bubble { max-width: 86%; }
      .suggestions { padding-left: 16px; padding-right: 16px; }
      .composer { margin: 0 10px 10px; }
      .composer-hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H11v16H7.5A2.5 2.5 0 0 0 5 21.5v-16Zm14 0A2.5 2.5 0 0 0 16.5 3H13v16h3.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>读页</div>
      <div class="ai-status"><span class="status-dot"></span><span>AI 阅读伙伴在线</span></div>
    </header>

    <div class="layout">
      <aside class="panel book-panel" aria-label="书籍信息">
        <div class="cover">
          <div class="cover-kicker">LE PETIT PRINCE</div>
          <h1>小王子</h1>
          <div class="cover-author">安托万·德·圣埃克苏佩里</div>
        </div>
        <div class="book-meta">
          <h2>正在阅读</h2>
          <p>一场跨越星球的旅行，一次关于爱、责任与成长的温柔追问。</p>
          <div class="progress-row"><span>阅读进度</span><strong>68%</strong></div>
          <div class="progress-track" aria-label="阅读进度 68%"><div class="progress-bar"></div></div>
        </div>
      </aside>

      <section class="panel workspace" aria-live="polite">
        <header class="workspace-header">
          <div><h2>和这本书聊一聊</h2><p id="headerSubtitle">从一个感兴趣的问题开始</p></div>
          <button class="ghost-btn hidden" id="resetBtn" type="button" title="重新选题"><span aria-hidden="true">↻</span><span>重新选题</span></button>
        </header>

        <div class="workspace-body">
          <div class="question-view" id="questionView">
            <span class="intro-badge">✦ AI 为你准备了 4 个问题</span>
            <h3>阅读不止于合上书页</h3>
            <p>选择一个触动你的问题。这里没有标准答案，只有值得展开的想法。</p>
            <div class="questions" id="questionList"></div>
          </div>

          <div class="chat-view" id="chatView">
            <div class="chat-topic"><span>正在讨论</span><p id="activeQuestion"></p></div>
            <div class="messages" id="messages"></div>
            <div class="suggestions" id="suggestions" aria-label="快捷追问"></div>
            <form class="composer" id="composer">
              <textarea id="messageInput" rows="1" maxlength="500" placeholder="写下你的理解……" aria-label="聊天输入框"></textarea>
              <div class="composer-footer">
                <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
                <button class="send-btn" id="sendBtn" type="submit" disabled>发送 <span aria-hidden="true">↑</span></button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const questionData = [
      { id: 1, tag: "人物与选择", question: "小王子为什么决定离开自己的星球？", prompt: "说说你觉得他真正想逃离的是什么？", answer: "小王子的离开，并不只是因为与玫瑰闹了别扭。更深一层看，他还不懂该怎样面对爱里的骄傲、误解和责任，于是选择用旅行寻找答案。\n\n你的回答让我想到：离开有时并非放弃，而是一个人尚未学会留下。经历不同星球之后，他才逐渐明白自己与玫瑰之间的关系为什么独一无二。" },
      { id: 2, tag: "关系与成长", question: "狐狸所说的“驯养”意味着什么？", prompt: "在你看来，建立关系会带来什么改变？", answer: "“驯养”可以理解为建立联结：两个人原本只是彼此世界里的普通存在，因为投入时间、耐心和关注，才变得不可替代。\n\n它也意味着责任。联结带来快乐，也让人有失去的可能。狐狸没有因此拒绝靠近，反而提醒小王子：关系的价值正来自我们愿意为它承担什么。" },
      { id: 3, tag: "爱与责任", question: "玫瑰对小王子来说究竟代表什么？", prompt: "她为什么能与花园里成千上万朵玫瑰不同？", answer: "玫瑰代表的是一段被亲自照料过的关系。她未必比其他玫瑰更完美，但小王子为她浇水、挡风，也忍受过她的骄傲与敏感。\n\n真正让她独特的，并不是外表，而是小王子投入其中的时间与感情。爱在这里不是发现一个完美对象，而是在相处中共同创造“独一无二”。" },
      { id: 4, tag: "成人世界", question: "为什么成年人总喜欢用数字理解世界？", prompt: "数字让人更接近真相，还是更容易忽略真相？", answer: "数字提供了一种确定感：年龄、价格、大小都可以比较，也容易被证明。但当成年人只相信可量化的信息时，人的感受、关系和想象力就可能被排除在“重要的事”之外。\n\n书中并不是否定数字，而是在提醒我们：数字可以描述事物，却未必能够解释它为什么值得珍惜。理解世界，需要事实，也需要感受力。" }
    ];

    const followUps = ["这和成长有什么关系？", "能举一个生活中的例子吗？", "书里还有哪些细节能说明？"];
    const genericReplies = [
      "这个角度很有意思。小王子的旅程常常把一个看似简单的问题，慢慢变成关于关系和自我认识的追问。你可以再想一步：如果他没有离开，他是否还能理解玫瑰的独特？",
      "我很喜欢你抓住的这一点。书中的答案通常不是由某个角色直接说出的，而是藏在小王子的经历前后变化里。也许可以比较一下他出发时和遇见狐狸之后，对“重要”这件事的理解有什么不同。",
      "这恰好触及了《小王子》的温柔之处：成长并不是变得无所不知，而是逐渐看清自己愿意为谁负责。你觉得这种责任更像负担，还是让关系有了意义？"
    ];

    const state = { selected: null, firstReply: true, busy: false, replyIndex: 0 };
    const $ = selector => document.querySelector(selector);
    const questionView = $("#questionView");
    const chatView = $("#chatView");
    const messages = $("#messages");
    const input = $("#messageInput");
    const sendBtn = $("#sendBtn");

    function renderQuestions() {
      $("#questionList").innerHTML = questionData.map((item, index) => `
        <button class="question-card" type="button" data-id="${item.id}">
          <span class="question-number">0${index + 1}</span>
          <strong>${item.question}</strong>
          <small>${item.tag}</small><span class="question-arrow" aria-hidden="true">→</span>
        </button>`).join("");
    }

    function selectQuestion(id) {
      state.selected = questionData.find(item => item.id === id);
      state.firstReply = true;
      state.replyIndex = 0;
      messages.innerHTML = "";
      $(".workspace").classList.add("chatting");
      document.querySelectorAll(".question-card").forEach(card => card.classList.toggle("active", Number(card.dataset.id) === id));
      chatView.classList.add("active");
      $("#resetBtn").classList.remove("hidden");
      $("#headerSubtitle").textContent = "先写下你的想法，AI 会陪你一起展开";
      $("#activeQuestion").textContent = state.selected.question;
      renderSuggestions(["我还没想好，给我一点提示", "先看看这个问题的背景"]);
      addMessage("ai", `${state.selected.prompt}\n\n不用担心答得是否正确，我更想听听你的真实理解。`);
      input.placeholder = "写下你的理解……";
      setTimeout(() => input.focus(), 250);
    }

    function addMessage(role, text, isThinking = false) {
      const el = document.createElement("div");
      el.className = `message ${role}`;
      if (role === "ai") el.innerHTML = `<div class="avatar" aria-label="AI">✦</div><div class="bubble">${isThinking ? '<span class="thinking"><i></i><i></i><i></i></span>' : escapeHtml(text)}</div>`;
      else el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    function renderSuggestions(items = followUps) {
      $("#suggestions").innerHTML = items.map(text => `<button class="suggestion" type="button">${text}</button>`).join("");
    }

    function buildReply(text) {
      const lower = text.toLowerCase();
      if (state.firstReply) { state.firstReply = false; return state.selected.answer; }
      if (lower.includes("成长")) return "成长在这里不是抛弃童真，而是学会看见选择背后的责任。小王子经历了国王、商人和地理学家之后，发现知识或权力并不能自动带来理解；真正改变他的是与狐狸建立关系，并重新认识自己对玫瑰的责任。";
      if (lower.includes("例子") || lower.includes("生活")) return "比如一位朋友可能起初只是通讯录里的普通名字。当你们一起经历低落、分享秘密、记住彼此的小习惯之后，这段关系才变得不可替代。不是对方在客观上胜过所有人，而是共同投入的时间赋予了关系意义。";
      if (lower.includes("细节") || lower.includes("原文") || lower.includes("书里")) return "可以留意三个前后呼应的细节：小王子离开时不懂玫瑰的言外之意；看见玫瑰园时误以为自己的玫瑰不再独特；遇见狐狸后，他才理解投入的时间和照料让一段关系不可替代。这三个节点组成了他的认识变化。";
      if (lower.includes("提示") || lower.includes("背景")) return `可以从“离开前”和“旅行后”的变化入手。想想看：${state.selected.question} 不必急着下结论，先找出他前后态度不同的地方。`;
      return genericReplies[state.replyIndex++ % genericReplies.length];
    }

    function sendMessage(text) {
      const value = text.trim();
      if (!value || state.busy) return;
      addMessage("user", value);
      input.value = "";
      autoResize();
      state.busy = true;
      sendBtn.disabled = true;
      $("#suggestions").innerHTML = "";
      const thinking = addMessage("ai", "", true);
      window.setTimeout(() => {
        thinking.remove();
        addMessage("ai", buildReply(value));
        state.busy = false;
        sendBtn.disabled = !input.value.trim();
        input.placeholder = "继续追问，或分享新的想法……";
        renderSuggestions();
        input.focus();
      }, 900 + Math.random() * 450);
    }

    function resetChat() {
      state.selected = null;
      state.busy = false;
      messages.innerHTML = "";
      input.value = "";
      $(".workspace").classList.remove("chatting");
      document.querySelectorAll(".question-card").forEach(card => card.classList.remove("active"));
      chatView.classList.remove("active");
      $("#resetBtn").classList.add("hidden");
      $("#headerSubtitle").textContent = "从一个感兴趣的问题开始";
      sendBtn.disabled = true;
      showToast("对话已清空，可以选择新的问题");
    }

    function showToast(text) {
      const toast = $("#toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function autoResize() {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 120)}px`;
      sendBtn.disabled = state.busy || !input.value.trim();
    }

    $("#questionList").addEventListener("click", event => {
      const card = event.target.closest(".question-card");
      if (card) selectQuestion(Number(card.dataset.id));
    });
    $("#suggestions").addEventListener("click", event => {
      const button = event.target.closest(".suggestion");
      if (button) sendMessage(button.textContent);
    });
    $("#composer").addEventListener("submit", event => { event.preventDefault(); sendMessage(input.value); });
    input.addEventListener("input", autoResize);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); sendMessage(input.value); }
    });
    $("#resetBtn").addEventListener("click", resetChat);
    renderQuestions();
  </script>
</body>
</html>
